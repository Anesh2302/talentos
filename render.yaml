services:
  - type: web
    name: talentos
    runtime: python
    repo: https://github.com/Anesh2302/talentos
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --workers 4 --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///talentos.db
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
