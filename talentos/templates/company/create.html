{% extends "base.html" %}
{% block title %}TalentOS — Create Company{% endblock %}
{% block heading %}Create Company{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <label for="name">Company Name</label>
    <input type="text" id="name" name="name" required>
    <label for="industry">Industry</label>
    <input type="text" id="industry" name="industry" placeholder="e.g. Technology, Healthcare">
    <label for="location">Location</label>
    <input type="text" id="location" name="location" placeholder="City, Country">
    <label for="size">Company Size</label>
    <select id="size" name="size">
      <option value="">Select size</option>
      <option value="1-10">1-10 employees</option>
      <option value="11-50">11-50 employees</option>
      <option value="51-200">51-200 employees</option>
      <option value="201-1000">201-1000 employees</option>
      <option value="1000+">1000+ employees</option>
    </select>
    <label for="website">Website</label>
    <input type="url" id="website" name="website" placeholder="https://example.com">
    <label for="logo_url">Logo URL</label>
    <input type="url" id="logo_url" name="logo_url" placeholder="https://example.com/logo.png">
    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="Tell us about your company..."></textarea>
    <button type="submit" class="btn btn-primary">Create Company</button>
  </form>
</div>
{% endblock %}
