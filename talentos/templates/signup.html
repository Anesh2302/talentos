<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TalentOS — Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg1: #0d1117; --text: #c9d1d9; --text2: #8b949e; --text3: #484f58; --border: #30363d; --accent: #58a6ff; --orange: #f0883e; --green: #3fb950; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes drift { 0% { transform: translate(0,0); } 25% { transform: translate(40px,-30px); } 50% { transform: translate(-30px,40px); } 75% { transform: translate(20px,-20px); } 100% { transform: translate(0,0); } }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0d1117 0%, #161b22 50%, #0d1117 100%); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
    .bg-orbs { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .bg-orbs .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.12; animation: drift 25s ease-in-out infinite; }
    .bg-orbs .orb:nth-child(1) { width: 500px; height: 500px; background: var(--accent); top: -150px; left: -150px; }
    .bg-orbs .orb:nth-child(2) { width: 350px; height: 350px; background: var(--orange); bottom: -100px; right: -100px; animation-delay: -8s; }
    .bg-orbs .orb:nth-child(3) { width: 200px; height: 200px; background: var(--green); top: 50%; left: 60%; animation-delay: -15s; }
    .card { background: rgba(22,27,34,0.7); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(48,54,61,0.4); border-radius: 16px; padding: 48px 40px; width: 520px; max-width: 94vw; animation: slideUp 0.6s ease-out; position: relative; overflow: hidden; z-index: 1; }
    .card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--orange), var(--green)); background-size: 200% 100%; animation: shimmer 4s linear infinite; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 4px; font-size: 28px; animation: fadeIn 0.8s ease-out; }
    h1::before { content: "◆ "; font-size: 18px; color: var(--orange); animation: pulse 2s infinite; }
    .subtitle { text-align: center; color: var(--text2); font-size: 14px; margin-bottom: 24px; animation: fadeIn 1s ease-out; }
    label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 4px; font-weight: 600; }
    input, select { width: 100%; padding: 10px 12px; background: rgba(13,17,23,0.6); border: 2px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none; transition: all 0.3s ease; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,0.15); background: rgba(22,27,34,0.8); }
    input[type="file"] { padding: 8px; }
    button { width: 100%; padding: 12px; background: linear-gradient(135deg, #238636, #2ea043); border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(35,134,54,0.4); }
    .form-row { display: flex; gap: 12px; }
    .form-row > * { flex: 1; }
    .error { background: rgba(58,28,28,0.8); backdrop-filter: blur(6px); color: #f85149; padding: 12px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; border: 1px solid #6a2d2d; }
    .loading { display: none; text-align: center; color: var(--text2); font-size: 13px; margin-top: 12px; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text3); }
    .link { text-align: center; margin-top: 16px; font-size: 13px; }
    .link a { color: var(--accent); text-decoration: none; }
    .link a:hover { color: var(--orange); text-decoration: underline; }
    .section-title { font-size: 14px; color: var(--text2); font-weight: 700; margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

    @media (max-width: 1024px) {
      .card { width: 480px; padding: 36px 28px; }
    }
    @media (max-width: 768px) {
      body { align-items: flex-start; padding-top: 24px; padding-bottom: 24px; }
      .card { max-width: 98vw; padding: 28px 20px; }
    }
    @media (max-width: 480px) {
      .card { padding: 20px 14px; max-width: 96vw; }
      h1 { font-size: 22px; }
      .form-row { flex-direction: column; gap: 0; }
      input { padding: 12px 12px; font-size: 16px; }
      button { padding: 14px 12px; font-size: 16px; }
      label { font-size: 13px; }
      select { padding: 12px 12px; }
      .link { font-size: 12px; }
    }
    @media (max-width: 360px) {
      body { padding: 10px; }
      .card { padding: 14px 10px; max-width: 100vw; border-radius: 10px; }
      h1 { font-size: 18px; }
      .form-row { flex-direction: column; gap: 0; }
      input { padding: 10px 10px; font-size: 14px; }
      button { padding: 12px 10px; font-size: 14px; }
      label { font-size: 11px; }
      select { padding: 10px 10px; }
      .link { font-size: 11px; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>
<div class="card">
  <h1>TalentOS</h1>
  <p class="subtitle">Create your account</p>
  <div class="error" id="error"></div>
  <form id="signupForm" enctype="multipart/form-data">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Your name" required autofocus>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>

    <div class="section-title">Account Security</div>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Min 8 chars, upper + lower + number + special" required minlength="8" style="margin-bottom:6px">
    <div id="pwStrength" style="display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap">
      <span id="pwLen" style="font-size:10px;color:var(--text3);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">8+ chars</span>
      <span id="pwUpper" style="font-size:10px;color:var(--text3);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">A-Z</span>
      <span id="pwLower" style="font-size:10px;color:var(--text3);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">a-z</span>
      <span id="pwNum" style="font-size:10px;color:var(--text3);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">0-9</span>
      <span id="pwSpec" style="font-size:10px;color:var(--text3);padding:2px 6px;border-radius:4px;border:1px solid var(--border)">!@#$%</span>
    </div>

    <div class="section-title">Contact Information</div>
    <div class="form-row">
      <div><label for="phone">Phone</label><input type="tel" id="phone" placeholder="+1 555-0000"></div>
      <div><label for="role">Role</label>
        <select id="role">
          <option value="recruiter">Recruiter</option>
          <option value="candidate" selected>Candidate</option>
        </select>
      </div>
    </div>

    <div class="section-title">Professional Profiles</div>
    <label for="linkedin">LinkedIn URL</label>
    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
    <div class="form-row">
      <div><label for="github">GitHub URL</label><input type="url" id="github" placeholder="https://github.com/yourhandle"></div>
      <div><label for="website">Website / Portfolio</label><input type="url" id="website" placeholder="https://yoursite.com"></div>
    </div>

    <div class="section-title">Default Resume</div>
    <label for="resume">Upload Resume (PDF, DOC, DOCX)</label>
    <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx,.txt" style="margin-bottom:16px">

    <button type="submit">Create Account</button>
    <div class="loading" id="loading">Creating account...</div>
  </form>
  <div class="link">Already have an account? <a href="/auth/login">Sign in</a></div>
  <div class="link" style="margin-top:4px"><a href="/" style="color:var(--text3)">← Back to Home</a></div>
  <div class="footer">TalentOS v2.0</div>
</div>
<script>
document.getElementById('password').addEventListener('input', function() {
  const v = this.value;
  function set(id, ok) { const el = document.getElementById(id); el.style.borderColor = ok ? 'var(--green)' : 'var(--border)'; el.style.color = ok ? 'var(--green)' : 'var(--text3)'; el.style.background = ok ? 'rgba(63,185,80,0.1)' : 'transparent'; }
  set('pwLen', v.length >= 8);
  set('pwUpper', /[A-Z]/.test(v));
  set('pwLower', /[a-z]/.test(v));
  set('pwNum', /[0-9]/.test(v));
  set('pwSpec', /[!@#$%^&*(),.?":{}|<>_\-+]/.test(v));
});
document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const fd = new FormData();
  fd.append('name', document.getElementById('name').value);
  fd.append('email', document.getElementById('email').value);
  fd.append('password', document.getElementById('password').value);
  fd.append('role', document.getElementById('role').value);
  fd.append('phone', document.getElementById('phone').value);
  fd.append('linkedin', document.getElementById('linkedin').value);
  fd.append('github', document.getElementById('github').value);
  fd.append('website', document.getElementById('website').value);
  const resumeFile = document.getElementById('resume').files[0];
  if (resumeFile) fd.append('resume', resumeFile);
  const errorEl = document.getElementById('error');
  const loadingEl = document.getElementById('loading');
  errorEl.style.display = 'none';
  loadingEl.style.display = 'block';
  try {
    const res = await fetch('/auth/register', { method: 'POST', body: fd });
    const data = await res.json();
    if (res.ok) { window.location.href = '/auth/login?registered=1'; }
    else { errorEl.textContent = data.error || 'Registration failed'; errorEl.style.display = 'block'; }
  } catch (err) { errorEl.textContent = 'Network error. Please try again.'; errorEl.style.display = 'block'; }
  finally { loadingEl.style.display = 'none'; }
});
</script>
</body>
</html>
