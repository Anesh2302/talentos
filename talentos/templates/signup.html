<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talentos — Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 40px; width: 380px; }
    h1 { color: #58a6ff; text-align: center; margin-bottom: 8px; font-size: 24px; }
    .subtitle { text-align: center; color: #8b949e; font-size: 14px; margin-bottom: 28px; }
    label { display: block; font-size: 13px; color: #8b949e; margin-bottom: 6px; }
    input, select { width: 100%; padding: 10px 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #c9d1d9; font-size: 14px; margin-bottom: 18px; outline: none; }
    input:focus, select:focus { border-color: #58a6ff; }
    button { width: 100%; padding: 10px; background: #238636; border: none; border-radius: 6px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2ea043; }
    .error { background: #f85149; color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; display: none; }
    .loading { display: none; text-align: center; color: #8b949e; font-size: 13px; margin-top: 12px; }
    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: #484f58; }
    .link { text-align: center; margin-top: 16px; font-size: 13px; }
    .link a { color: #58a6ff; text-decoration: none; }
    .link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="card">
  <h1>Talentos</h1>
  <p class="subtitle">Create your account</p>
  <div class="error" id="error"></div>
  <form id="signupForm">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Your name" required autofocus>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
    <label for="role">Role</label>
    <select id="role">
      <option value="admin">Admin</option>
      <option value="recruiter">Recruiter</option>
      <option value="candidate" selected>Candidate</option>
    </select>
    <button type="submit">Create Account</button>
    <div class="loading" id="loading">Creating account...</div>
  </form>
  <div class="link">Already have an account? <a href="/auth/login">Sign in</a></div>
  <div class="footer">Talentos v1.0</div>
</div>
<script>
document.getElementById('signupForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;
  const errorEl = document.getElementById('error');
  const loadingEl = document.getElementById('loading');
  errorEl.style.display = 'none';
  loadingEl.style.display = 'block';
  try {
    const res = await fetch('/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, role })
    });
    const data = await res.json();
    if (res.ok) {
      window.location.href = '/auth/login?registered=1';
    } else {
      errorEl.textContent = data.error || data.message || 'Registration failed';
      errorEl.style.display = 'block';
    }
  } catch (err) {
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
  } finally {
    loadingEl.style.display = 'none';
  }
});
</script>
</body>
</html>
