{% extends "base.html" %}
{% block title %}TalentOS — Post a Job{% endblock %}
{% block heading %}Post a Job{% endblock %}
{% block content %}
<div class="card">
  <form method="POST">
    <div class="form-row">
      <div><label for="title">Job Title</label><input type="text" id="title" name="title" required></div>
      <div><label for="company_id">Company</label><select id="company_id" name="company_id" required>
        <option value="">Select company</option>
        {% for c in companies %}
        <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select></div>
    </div>
    <div class="form-row">
      <div><label for="location">Location</label><input type="text" id="location" name="location"></div>
      <div><label for="job_type">Job Type</label><select id="job_type" name="job_type">
        <option value="full-time">Full-time</option>
        <option value="part-time">Part-time</option>
        <option value="contract">Contract</option>
        <option value="internship">Internship</option>
        <option value="remote">Remote</option>
      </select></div>
      <div><label for="experience_level">Experience</label><select id="experience_level" name="experience_level">
        <option value="entry">Entry Level</option>
        <option value="mid">Mid Level</option>
        <option value="senior">Senior</option>
        <option value="lead">Lead</option>
      </select></div>
    </div>
    <div class="form-row">
      <div><label for="salary_min">Min Salary</label><input type="number" id="salary_min" name="salary_min"></div>
      <div><label for="salary_max">Max Salary</label><input type="number" id="salary_max" name="salary_max"></div>
    </div>
    <label for="skills_required">Required Skills (comma separated)</label>
    <input type="text" id="skills_required" name="skills_required" placeholder="Python, React, SQL">
    <label for="description">Job Description</label>
    <textarea id="description" name="description" required placeholder="Describe the role..."></textarea>
    <label for="requirements">Requirements</label>
    <textarea id="requirements" name="requirements" placeholder="What candidates need..."></textarea>
    <button type="submit" class="btn btn-primary">Post Job</button>
  </form>
</div>
{% endblock %}
